plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
  namespace 'com.zjf.edgeai.agent.litertlm'
  compileSdk rootProject.ext.android.compileSdkVersion
  defaultConfig { minSdk rootProject.ext.android.minSdkVersion; consumerProguardFiles 'consumer-rules.pro' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
  kotlinOptions { jvmTarget = '21' }
  buildFeatures { buildConfig true }
  defaultConfig { buildConfigField 'String', 'LITERT_LM_VERSION', '"' + rootProject.ext.liteRtLmVersion + '"' }
  packaging {
    resources {
      excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
    }
  }
}
kotlin { jvmToolchain(21) }

dependencies {
  implementation project(':edge-agent-api')
  implementation project(':edge-agent-core')
  implementation project(':edge-agent-adk')
  implementation project(':edge-agent-capabilities')
  implementation project(':edge-ai')
  api "com.google.ai.edge.litertlm:litertlm-android:$rootProject.ext.liteRtLmVersion"
  testImplementation 'junit:junit:4.13.2'
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutinesVersion"
}
