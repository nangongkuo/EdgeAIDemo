plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.serialization'
  id 'com.google.devtools.ksp'
}

android {
  namespace 'com.zjf.edgeai.agent.storage.room'
  compileSdk rootProject.ext.android.compileSdkVersion
  defaultConfig { minSdk rootProject.ext.android.minSdkVersion; consumerProguardFiles 'consumer-rules.pro' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
  kotlinOptions { jvmTarget = '21' }
  testOptions { unitTests.includeAndroidResources = true }
  sourceSets { test.assets.srcDirs += files("$projectDir/schemas") }
}
kotlin { jvmToolchain(21) }
ksp { arg('room.schemaLocation', "$projectDir/schemas") }

dependencies {
  implementation project(':edge-agent-api')
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$rootProject.ext.serializationVersion"
  implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
  implementation "androidx.room:room-ktx:$rootProject.ext.roomVersion"
  ksp "androidx.room:room-compiler:$rootProject.ext.roomVersion"
  testImplementation 'junit:junit:4.13.2'
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutinesVersion"
  testImplementation "androidx.room:room-testing:$rootProject.ext.roomVersion"
  testImplementation 'androidx.test:core:1.7.0'
  testImplementation 'org.robolectric:robolectric:4.16.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
