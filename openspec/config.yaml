schema: spec-driven

context: |
  EdgeAIDemo 是面向 Google AI Edge LiteRT-LM 的 Android 12+ ARM64 验证应用。
  applicationId 为 com.zjf.edgeai。生产代码使用 Kotlin、XML View 和 AndroidX。
  项目包含 app UI 模块和隔离模型存储及 LiteRT-LM 运行时集成的 edge-ai Android 库。
  经许可批准的 .litertlm 模型作为未压缩应用资源进行本地分发，会在首次启动时事务式复制到应用私有存储，
  并自动初始化；用户仍可通过 SAF 替换。模型二进制和访问令牌属于本地构建输入，绝不可提交到 Git 仓库。
  LiteRT-LM JNI 生命周期调用必须串行化，且必须显式关闭 Engine/Conversation 资源。
  模拟器运行仅验证 UI 与错误处理；推理验收需要 Android 12+ ARM64 硬件。

rules:
  proposal:
    - 陈述用户可见的验证结果和明确的非目标。
  specs:
    - 每项需求必须使用 SHALL 或 MUST；适用时必须包含成功和失败场景。
  design:
    - 记录模块所有权、线程、原生资源生命周期、GPU 回退和模型存储决策。
  tasks:
    - 编排任务顺序，使 OpenSpec 验证和自动化测试先于真机验收执行。
